# Tiny configuration for smoke tests (few frames, small model, frequent validation).
_base_: kitti_flow.yaml
wandb:
  project: i2pflow-debug
data:
  num_workers: 4
  max_train_frames: 64
  max_val_frames: 8
  max_test_frames: 8
model:
  d_model: 64
  depth: 2
  heads: 4
  n_points: 128
flow:
  samples_per_frame: 8
train:
  frames_per_step: 2
  total_steps: 4
  warmup_steps: 2
  log_every: 2
  val_every: 4
  ckpt_every: 4
eval:
  frames_per_batch: 2
  n_samples: 8
  val_max_frames: 4
inference:
  steps: 3
  chunk: 8
  nll_steps: 3
